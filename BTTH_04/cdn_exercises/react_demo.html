<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo — React</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; line-height: 1.5; }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .todo-item.done span { text-decoration: line-through; color: #999; }
        .todo-item button { margin-left: auto; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        input[type="text"] { padding: 8px; width: 70%; }
        button.add-btn { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .empty { color: #777; padding: 1rem 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function TodoApp() {
            const [todos, setTodos] = useState([
                { id: 1, text: "Học JSX", done: false },
                { id: 2, text: "So sánh DOM thuần với React", done: true }
            ]);
            const [input, setInput] = useState("");

            function addTodo() {
                const text = input.trim();
                if (!text) return;

                const newTodo = {
                    id: Date.now(),
                    text,
                    done: false
                };

                setTodos([...todos, newTodo]);
                setInput("");
            }

            function toggleTodo(id) {
                setTodos(todos.map(todo =>
                    todo.id === id ? { ...todo, done: !todo.done } : todo
                ));
            }

            function deleteTodo(id) {
                setTodos(todos.filter(todo => todo.id !== id));
            }

            function handleKeyDown(event) {
                if (event.key === "Enter") {
                    addTodo();
                }
            }

            return (
                <div>
                    <h1>📋 Todo List</h1>
                    <div>
                        <input
                            type="text"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder="Nhập công việc..."
                        />
                        <button className="add-btn" onClick={addTodo}>Thêm</button>
                    </div>

                    {todos.length === 0 ? (
                        <p className="empty">Chưa có công việc nào.</p>
                    ) : (
                        todos.map(todo => (
                            <div key={todo.id} className={`todo-item ${todo.done ? "done" : ""}`}>
                                <input
                                    type="checkbox"
                                    checked={todo.done}
                                    onChange={() => toggleTodo(todo.id)}
                                />
                                <span>{todo.text}</span>
                                <button onClick={() => deleteTodo(todo.id)}>Xóa</button>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<TodoApp />);
    </script>
</body>
</html>
