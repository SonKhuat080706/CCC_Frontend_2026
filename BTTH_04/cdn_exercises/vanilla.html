<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Todo — Vanilla JS</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; line-height: 1.5; }
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; }
        .todo-item.done span { text-decoration: line-through; color: #999; }
        .todo-item button { margin-left: auto; background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        input[type="text"] { padding: 8px; width: 70%; }
        button.add-btn { padding: 8px 16px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .empty { color: #777; padding: 1rem 0; }
    </style>
</head>
<body>
    <h1>📋 Todo List</h1>
    <div>
        <input type="text" id="todoInput" placeholder="Nhập công việc..." onkeydown="handleKeyDown(event)">
        <button class="add-btn" onclick="addTodo()">Thêm</button>
    </div>
    <div id="todoList"></div>

    <script>
        let todos = [
            { id: 1, text: "Học JSX", done: false },
            { id: 2, text: "So sánh DOM thuần với React", done: true }
        ];

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[char];
            });
        }

        function renderTodos() {
            const list = document.getElementById("todoList");

            if (todos.length === 0) {
                list.innerHTML = '<p class="empty">Chưa có công việc nào.</p>';
                return;
            }

            list.innerHTML = todos.map(todo => `
                <div class="todo-item ${todo.done ? "done" : ""}">
                    <input type="checkbox"
                           ${todo.done ? "checked" : ""}
                           onchange="toggleTodo(${todo.id})">
                    <span>${escapeHtml(todo.text)}</span>
                    <button onclick="deleteTodo(${todo.id})">Xóa</button>
                </div>
            `).join("");
        }

        function addTodo() {
            const input = document.getElementById("todoInput");
            const text = input.value.trim();

            if (!text) {
                alert("Vui lòng nhập công việc.");
                input.focus();
                return;
            }

            const newTodo = {
                id: Date.now(),
                text,
                done: false
            };

            todos.push(newTodo);
            renderTodos();
            input.value = "";
            input.focus();
        }

        function toggleTodo(id) {
            const todo = todos.find(item => item.id === id);
            if (todo) {
                todo.done = !todo.done;
            }
            renderTodos();
        }

        function deleteTodo(id) {
            todos = todos.filter(todo => todo.id !== id);
            renderTodos();
        }

        function handleKeyDown(event) {
            if (event.key === "Enter") {
                addTodo();
            }
        }

        renderTodos();
    </script>
</body>
</html>
