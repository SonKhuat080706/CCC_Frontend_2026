<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản - Bài B1</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        fieldset { border: 1px solid #ccc; border-radius: 5px; margin-bottom: 1.5rem; padding: 1rem; }
        legend { font-weight: bold; background: #fff; padding: 0 5px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="tel"], 
        input[type="date"], input[type="password"], select, textarea {
            width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        .radio-group, .checkbox-group { display: flex; align-items: center; gap: 1rem; }
        .radio-group label, .checkbox-group label { display: flex; align-items: center; gap: 0.3rem; font-weight: normal; margin-bottom: 0; }
        input[type="radio"], input[type="checkbox"] { width: auto; }
        .buttons { display: flex; gap: 1rem; margin-top: 1rem; }
        button { padding: 0.7rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button[type="submit"] { background: #007bff; color: white; }
        button[type="reset"] { background: #f8f9fa; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>Đăng ký Tài khoản E-Commerce</h2>

    <form action="#" method="POST">
        
        <!-- Fieldset 1: Thông tin cá nhân -->
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <div class="form-group">
                <label for="fullName">Họ và tên</label>
                <input type="text" id="fullName" name="fullName" required minlength="2" maxlength="50" placeholder="Nhập họ và tên đầy đủ">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="ví dụ: hoten@gmail.com">
            </div>
            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Nhập 10 chữ số">
            </div>
            <div class="form-group">
                <label for="dob">Ngày sinh</label>
                <input type="date" id="dob" name="dob" placeholder="dd/mm/yyyy">
            </div>
        </fieldset>

        <!-- Fieldset 2: Tài khoản -->
        <fieldset>
            <legend>Tài khoản</legend>
            <div class="form-group">
                <label for="username">Tên đăng nhập (Username)</label>
                <input type="text" id="username" name="username" required pattern="[A-Za-z0-9_]{3,20}" title="Từ 3-20 ký tự, gồm chữ cái, số và dấu gạch dưới" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Ít nhất 8 ký tự, gồm tối thiểu 1 chữ hoa và 1 chữ số" placeholder="Nhập mật khẩu">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Nhập lại mật khẩu ở trên">
            </div>
        </fieldset>

        <!-- Fieldset 3: Thông tin giao hàng -->
        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <div class="form-group">
                <label>Giới tính</label>
                <div class="radio-group">
                    <label for="genderMale"><input type="radio" id="genderMale" name="gender" value="male"> Nam</label>
                    <label for="genderFemale"><input type="radio" id="genderFemale" name="gender" value="female"> Nữ</label>
                    <label for="genderOther"><input type="radio" id="genderOther" name="gender" value="other"> Khác</label>
                </div>
            </div>
            <div class="form-group">
                <label for="city">Thành phố / Tỉnh</label>
                <select id="city" name="city" required>
                    <option value="" disabled selected>-- Chọn Thành phố --</option>
                    <option value="HN">Hà Nội</option>
                    <option value="HCM">Hồ Chí Minh</option>
                    <option value="DN">Đà Nẵng</option>
                    <option value="CT">Cần Thơ</option>
                    <option value="HP">Hải Phòng</option>
                </select>
            </div>
            <div class="form-group">
                <label for="district">Quận / Huyện</label>
                <select id="district" name="district" required>
                    <option value="" disabled selected>-- Chọn Quận/Huyện --</option>
                    <option value="Q1">Quận 1</option>
                    <option value="Q2">Quận 2</option>
                    <option value="Q3">Quận 3</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">Địa chỉ chi tiết</label>
                <textarea id="address" name="address" rows="3" required placeholder="Nhập số nhà, tên đường, phường/xã..."></textarea>
            </div>
        </fieldset>

        <div class="form-group checkbox-group">
            <label for="terms">
                <input type="checkbox" id="terms" name="terms" required>
                Tôi đã đọc và đồng ý với các điều khoản sử dụng
            </label>
        </div>

        <div class="buttons">
            <button type="submit">Đăng ký tài khoản</button>
            <button type="reset">Nhập lại từ đầu</button>
        </div>

    </form>

    <script>
        // Set max date for Date of Birth to today
        const dobInput = document.getElementById('dob');
        const today = new Date().toISOString().split('T')[0];
        dobInput.max = today;
    </script>
</body>
</html>
