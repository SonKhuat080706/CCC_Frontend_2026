<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Dashboard - Bảng điều khiển tích hợp</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Control Header -->
        <header class="db-header">
            <div class="db-title-area">
                <h1><i class="fa-solid fa-chart-line"></i> METRICSHUB</h1>
                <p>Bảng điều khiển tổng hợp dữ liệu bất đồng bộ song song</p>
            </div>
            <div class="db-controls">
                <span class="performance-timer" id="perf-timer">Dữ liệu chưa tải</span>
                <button class="btn-refresh" id="refresh-all-btn">
                    <i class="fa-solid fa-arrows-rotate"></i> Làm mới toàn bộ
                </button>
            </div>
        </header>

        <!-- Main Dashboard Grid -->
        <main class="dashboard-grid">
            <!-- Widget 1: REST Countries -->
            <section class="widget" id="widget-country">
                <div class="widget-header">
                    <h3><i class="fa-solid fa-earth-asia"></i> Quốc gia học</h3>
                    <button class="widget-refresh" onclick="refreshWidget(0)"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="widget-content" id="content-country">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Widget 2: Random Users -->
            <section class="widget" id="widget-users">
                <div class="widget-header">
                    <h3><i class="fa-solid fa-user-group"></i> Nhân sự ngẫu nhiên</h3>
                    <button class="widget-refresh" onclick="refreshWidget(1)"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="widget-content" id="content-users">
                    <!-- Dynamic Content -->
                </div>
            </section>

            <!-- Widget 3: Dog API -->
            <section class="widget" id="widget-dog">
                <div class="widget-header">
                    <h3><i class="fa-solid fa-dog"></i> Thú cưng ngẫu nhiên</h3>
                    <button class="widget-refresh" onclick="refreshWidget(2)"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="widget-content" id="content-dog">
                    <!-- Dynamic Content -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
