<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - Quản lý nhân sự</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Top Navigation / Header -->
        <header class="app-header">
            <div class="header-left">
                <h1><i class="fa-solid fa-users-gear"></i> USERDIR</h1>
                <p>Hệ thống quản trị thành viên tối giản & hiện đại</p>
            </div>
            <button id="add-user-btn" class="btn btn-primary">
                <i class="fa-solid fa-plus"></i> Thêm thành viên
            </button>
        </header>

        <!-- Actions Panel: Search and Filters -->
        <div class="actions-panel">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Tìm kiếm theo tên hoặc email...">
            </div>
        </div>

        <!-- Users Grid / Table Container -->
        <main class="users-grid" id="users-grid">
            <!-- Skeleton cards or real cards will load here -->
        </main>
    </div>

    <!-- Modal for Create / Edit -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Thêm thành viên mới</h3>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label for="user-name">Họ và tên</label>
                    <input type="text" id="user-name" required placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group">
                    <label for="user-email">Email</label>
                    <input type="email" id="user-email" required placeholder="example@domain.com">
                </div>
                <div class="form-group">
                    <label for="user-phone">Số điện thoại</label>
                    <input type="text" id="user-phone" placeholder="Số điện thoại...">
                </div>
                <div class="form-group">
                    <label for="user-website">Website</label>
                    <input type="text" id="user-website" placeholder="www.website.com">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Hủy bỏ</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
